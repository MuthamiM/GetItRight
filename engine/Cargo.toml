[package]
name = "getitright-engine"
version = "0.1.0"
edition = "2021"
description = "Real-Time High-Throughput Ingestion Engine for Polling, Surveys & Cryptographic Consensus"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
crossbeam-queue = "0.3"
