upstream poll_api {
    server backend:5000 max_fails=1 fail_timeout=5s;
    server backend-replica:5000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

# Rate limiting zones for DDoS & brute force attack mitigation
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Buffer sizes & timeouts against slowloris / buffer overflow attacks
    client_max_body_size 2m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Maximum concurrent connections per IP
    limit_conn conn_limit 35;
    limit_req zone=general_limit burst=50 nodelay;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Block known malicious bot scanners
    if ($http_user_agent ~* (acunetix|sqlmap|nikto|wpscan|masscan|nessus|zgrab|nmap|dirbuster|gobuster)) {
        return 403;
    }

    # Restrict unsupported HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive server & configuration files
    location ~* \.(sql|bak|py|sh|env|md|log|ini|yml|yaml)$ {
        deny all;
        return 404;
    }

    # Serve the current APK directly from this site so downloads stay on the IcapsQ domain.
    location = /app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.34-build-42.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /downloads/app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.34-build-42.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve static web files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=25 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_pass http://poll_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Forward real-time updates without exposing the backend service directly.
    location /ws/ {
        proxy_pass http://poll_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health check
    location /health {
        proxy_pass http://poll_api/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
