upstream poll_api {
    server backend:5000 max_fails=1 fail_timeout=5s;
    server backend-replica:5000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Serve the current APK directly from this site so downloads stay on the IcapsQ domain.
    location = /app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.27-build-33.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /downloads/app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.27-build-33.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve static web files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_pass http://poll_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Forward real-time updates without exposing the backend service directly.
    location /ws/ {
        proxy_pass http://poll_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health check
    location /health {
        proxy_pass http://poll_api/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
