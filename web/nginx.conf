upstream poll_api {
    server backend:5000 max_fails=2 fail_timeout=10s;
    server backend-replica:5000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# ── Real-IP extraction ─────────────────────────────────────────────
# Cloudflare Tunnel (cloudflared) forwards requests from localhost / Docker
# bridge. Without these directives, $remote_addr is always 172.19.0.1 and
# rate limits choke the entire tunnel instead of individual visitors.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Rate limiting zones for DDoS & brute force attack mitigation
# Now keyed on the real visitor IP after real_ip_header resolution
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Buffer sizes & timeouts against slowloris / buffer overflow attacks
    client_max_body_size 2m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 15s;
    keepalive_timeout 65s;

    # Maximum concurrent connections per IP (now per real visitor, not tunnel)
    limit_conn conn_limit 50;
    limit_req zone=general_limit burst=80 nodelay;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Block known malicious bot scanners
    if ($http_user_agent ~* (acunetix|sqlmap|nikto|wpscan|masscan|nessus|zgrab|nmap|dirbuster|gobuster)) {
        return 403;
    }

    # Restrict unsupported HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive server & configuration files
    location ~* \.(sql|bak|py|sh|env|md|log|ini|yml|yaml)$ {
        deny all;
        return 404;
    }

    # Serve the current APK directly from this site so downloads stay on the IcapsQ domain.
    location = /app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.34-build-44.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /downloads/app-release.apk {
        alias /usr/share/nginx/html/downloads/app-release.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="IcapsQ-v2.1.34-build-44.apk"' always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve static web files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_pass http://poll_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;
    }

    # Forward real-time updates without exposing the backend service directly.
    location /ws/ {
        proxy_pass http://poll_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health check
    location /health {
        proxy_pass http://poll_api/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

