upstream poll_api {
    server backend:5000 max_fails=1 fail_timeout=5s;
    server backend-replica:5000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com" always;

    # Send old direct APK URLs to the current release instead of serving a stale local artifact.
    location = /app-release.apk {
        return 302 https://github.com/MuthamiM/GetItRight/releases/download/v2.1.24/IcapsQ-v2.1.24-build-30.apk;
    }
    location = /downloads/app-release.apk {
        return 302 https://github.com/MuthamiM/GetItRight/releases/download/v2.1.24/IcapsQ-v2.1.24-build-30.apk;
    }

    # Serve static web files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_pass http://poll_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Forward real-time updates without exposing the backend service directly.
    location /ws/ {
        proxy_pass http://poll_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Health check
    location /health {
        proxy_pass http://poll_api/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
