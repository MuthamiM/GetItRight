<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GetItRight — Forgot Password</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #202124; background: #f4f6f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { width: min(420px, calc(100% - 40px)); background: white; border: 1px solid #e1e5ea; border-radius: 14px; padding: 28px; box-shadow: 0 5px 20px #20212412; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { color: #66717f; line-height: 1.5; font-size: 14px; }
    label { display: block; margin: 18px 0 6px; font-weight: 700; font-size: 13px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #c8ced6; border-radius: 8px; font: inherit; }
    button { margin-top: 18px; border: 0; background: #202124; color: white; font-weight: 700; cursor: pointer; }
    .back { display: block; margin-top: 18px; color: #202124; font-size: 14px; font-weight: 700; }
    .notice { min-height: 22px; margin-top: 14px; font-size: 14px; }
    .secondary { background: #eef1f4; color: #202124; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Forgot password?</h1>
    <p id="intro">Enter your account email and we will send a secure password-update link.</p>
    <form id="request-form">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email">
      <button type="submit">Send password-update link</button>
    </form>
    <form id="reset-form" hidden>
      <p id="link-help">This link and code expire after 10 minutes. Requesting another link invalidates the previous one.</p>
      <label for="otp">Recovery code</label>
      <input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" minlength="12" required>
      <button type="submit">Reset password</button>
    </form>
    <button id="new-request" class="secondary" type="button" hidden>Request a new password link</button>
    <div class="notice" id="notice"></div>
    <a class="back" href="login.html">← Back to sign in</a>
  </main>
  <script>
    const API = `${window.location.origin}/api`;
    const notice = document.getElementById('notice');
    const params = new URLSearchParams(window.location.search);
    const linkedEmail = params.get('email');
    const linkedOtp = params.get('otp');
    if (linkedEmail && linkedOtp) {
      document.getElementById('email').value = linkedEmail;
      document.getElementById('otp').value = linkedOtp;
      document.getElementById('request-form').hidden = true;
      document.getElementById('reset-form').hidden = false;
      document.getElementById('intro').textContent = 'Choose a new password for your account.';
      notice.textContent = 'Your secure password-update link is ready.';
      notice.style.color = '#16794c';
    }
    document.getElementById('request-form').addEventListener('submit', async event => {
      event.preventDefault();
      notice.textContent = 'Sending...';
      try {
        const response = await fetch(`${API}/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Unable to request recovery code.');
        notice.textContent = data.message || 'If the account exists, check your email for a recovery code.';
        notice.style.color = '#16794c';
        document.getElementById('reset-form').hidden = false;
      } catch (error) {
        notice.textContent = error.message || 'Unable to request recovery code.';
        notice.style.color = '#b42318';
      }
    });
    document.getElementById('reset-form').addEventListener('submit', async event => {
      event.preventDefault();
      notice.textContent = 'Resetting password...';
      try {
        const response = await fetch(`${API}/auth/verify-otp-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            otp: document.getElementById('otp').value.trim(),
            newPassword: document.getElementById('new-password').value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          if (response.status === 400 || response.status === 410) {
            document.getElementById('new-request').hidden = false;
            throw new Error('This recovery link or code has expired or was already used. Request a new password link.');
          }
          throw new Error(data.detail || 'Unable to reset password.');
        }
        notice.textContent = data.message || 'Password reset successfully.';
        notice.style.color = '#16794c';
        document.getElementById('reset-form').reset();
        document.getElementById('new-request').hidden = true;
        document.getElementById('intro').textContent = 'Your password was updated. You can now sign in.';
      } catch (error) {
        notice.textContent = error.message || 'Unable to reset password.';
        notice.style.color = '#b42318';
      }
    });
    document.getElementById('new-request').addEventListener('click', () => {
      document.getElementById('reset-form').hidden = true;
      document.getElementById('request-form').hidden = false;
      document.getElementById('new-request').hidden = true;
      document.getElementById('intro').textContent = 'Request a new secure password-update link.';
      notice.textContent = 'Enter your email to request a new link.';
      notice.style.color = '#66717f';
    });
  </script>
</body>
</html>
