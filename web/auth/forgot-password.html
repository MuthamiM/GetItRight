<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IcapsQ — Recover your account password.">
  <title>IcapsQ — Forgot Password</title>
  <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
  <link rel="icon" href="../assets/images/favicon-32x32.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --charcoal: #1F2023;
      --charcoal-elevated: #2E3035;
      --silver: #F2F2F3;
      --silver-border: #B8BAC0;
      --muted-gray: #6B6E76;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--silver);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--charcoal);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .auth-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .auth-brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--charcoal);
      letter-spacing: -0.02em;
    }

    .auth-brand-sub {
      font-size: 14px;
      color: var(--charcoal);
      opacity: 0.75;
      margin-top: 4px;
    }

    .auth-card {
      background: var(--charcoal);
      color: var(--silver);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 12px 40px rgba(48, 48, 48, 0.3);
    }

    .auth-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--silver);
      margin-bottom: 6px;
    }

    .auth-card p {
      font-size: 14px;
      color: var(--silver);
      opacity: 0.8;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--silver);
      opacity: 0.9;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, button {
      width: 100%;
      font-family: inherit;
    }

    input {
      padding: 13px 15px;
      background: rgba(229, 229, 229, 0.08);
      border: 1.5px solid rgba(229, 229, 229, 0.25);
      border-radius: 12px;
      color: var(--silver);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input:focus {
      border-color: var(--silver);
      background: rgba(229, 229, 229, 0.15);
    }

    button {
      padding: 14px;
      background: var(--silver);
      color: var(--charcoal);
      border: none;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button.secondary {
      background: rgba(229, 229, 229, 0.15);
      color: var(--silver);
      border: 1.5px solid rgba(229, 229, 229, 0.3);
      margin-top: 14px;
    }

    button.secondary:hover {
      background: rgba(229, 229, 229, 0.25);
    }

    .notice {
      min-height: 20px;
      margin-top: 16px;
      font-size: 13.5px;
      line-height: 1.4;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      background: rgba(229, 229, 229, 0.12);
      border: 1px solid rgba(229, 229, 229, 0.25);
      color: var(--silver);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13.5px;
      color: var(--charcoal);
      opacity: 0.85;
    }

    .auth-footer a {
      color: var(--charcoal);
      font-weight: 800;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-brand">
      <div class="auth-brand-logo">
        <img src="../assets/images/logo.png" alt="IcapsQ Logo">
      </div>
      <div class="auth-brand-name">IcapsQ</div>
      <div class="auth-brand-sub">Account Recovery</div>
    </div>

    <div class="auth-card">
      <h1>Forgot password?</h1>
      <p id="intro">Enter your account email and we will send a secure password recovery code.</p>

      <form id="request-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" type="email" required autocomplete="email" placeholder="name@organization.org">
        </div>
        <button type="submit">Send Recovery Code &rarr;</button>
      </form>

      <form id="reset-form" style="display:none;">
        <p id="link-help" style="font-size:13px; opacity:0.8; margin-bottom:14px;">This code expires after 10 minutes. Requesting a new code invalidates any previous code.</p>
        <div class="form-group">
          <label for="otp">Recovery code (6 digits)</label>
          <input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456">
        </div>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" minlength="8" required placeholder="••••••••">
        </div>
        <button type="submit">Reset Password &rarr;</button>
      </form>

      <button id="new-request" class="secondary" type="button" style="display:none;">Request a new password link</button>
      <div class="notice" id="notice"></div>
    </div>

    <div class="auth-footer">
      <a href="login.html">&larr; Back to sign in</a>
    </div>
  </div>

  <script>
    const API = `${window.location.origin}/api`;
    const notice = document.getElementById('notice');
    const params = new URLSearchParams(window.location.search);
    const linkedEmail = params.get('email');
    const linkedOtp = params.get('otp');

    function showNotice(msg) {
      notice.textContent = msg;
      notice.style.display = 'block';
    }

    if (linkedEmail && linkedOtp) {
      document.getElementById('email').value = linkedEmail;
      document.getElementById('otp').value = linkedOtp;
      document.getElementById('request-form').style.display = 'none';
      document.getElementById('reset-form').style.display = 'block';
      document.getElementById('intro').textContent = 'Choose a new password for your account.';
      showNotice('Your secure password recovery link is verified.');
    }

    document.getElementById('request-form').addEventListener('submit', async event => {
      event.preventDefault();
      showNotice('Sending recovery request...');
      try {
        const response = await fetch(`${API}/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Unable to request recovery code.');
        showNotice(data.message || 'If the account exists, check your email for the recovery code.');
        document.getElementById('reset-form').style.display = 'block';
      } catch (error) {
        showNotice(error.message || 'Unable to request recovery code.');
      }
    });

    document.getElementById('reset-form').addEventListener('submit', async event => {
      event.preventDefault();
      showNotice('Resetting password...');
      try {
        const response = await fetch(`${API}/auth/verify-otp-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            otp: document.getElementById('otp').value.trim(),
            newPassword: document.getElementById('new-password').value
          })
        });
        const data = await response.json();
        if (!response.ok) {
          if (response.status === 400 || response.status === 410) {
            document.getElementById('new-request').style.display = 'block';
            throw new Error('This recovery link or code has expired or was already used. Request a new code.');
          }
          throw new Error(data.detail || 'Unable to reset password.');
        }
        showNotice(data.message || 'Password reset successfully. You may now sign in.');
        document.getElementById('reset-form').reset();
        document.getElementById('new-request').style.display = 'none';
        document.getElementById('intro').textContent = 'Your password has been updated. Please sign in below.';
      } catch (error) {
        showNotice(error.message || 'Unable to reset password.');
      }
    });

    document.getElementById('new-request').addEventListener('click', () => {
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('request-form').style.display = 'block';
      document.getElementById('new-request').style.display = 'none';
      document.getElementById('intro').textContent = 'Request a new secure password recovery code.';
      showNotice('Enter your email to request a new code.');
    });
  </script>
</body>
</html>
