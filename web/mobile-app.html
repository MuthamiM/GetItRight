    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 72% 36%, rgba(255,255,255,.045), transparent 34%), #303030;
    }
    .site-header {
      width: min(100% - 64px, 1080px);

      display: flex;
      align-items: center;
      justify-content: space-between;

    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #E5E5E5; text-decoration: none; }
    .brand img { width: 34px; height: 34px; object-fit: contain; }
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: -.4px; }
    .back-link { color: #B8B8B8; font-size: 14px; text-decoration: none; }
    .back-link:hover { color: #E5E5E5; }
    .hero {
      width: min(100% - 64px, 920px);
      min-height: calc(100vh - 116px);
      margin: 0 auto;
      padding: 48px 0 56px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      align-items: center;
      gap: clamp(40px, 8vw, 100px);
    }
    .eyebrow { margin: 0 0 16px; color: #B8B8B8; font-size: 11px; font-weight: 750; letter-spacing: 1.5px; }

    .intro { max-width: 470px; margin: 18px 0 0; color: #B8B8B8; font-size: 16px; line-height: 1.65; }
    .download-card {
      width: 100%;
      padding: 15px;
      border: 1px solid #3E3E3E;
      border-radius: 20px;
      background: #262626;
      box-shadow: 0 16px 38px rgba(0,0,0,.22);
    }
    .app-row { display: flex; align-items: center; gap: 12px; }
    .app-logo { width: 40px; height: 40px; object-fit: contain; padding: 4px; border-radius: 12px; background: #303030; }
    .app-label { margin: 0 0 3px; color: #888; font-size: 10px; font-weight: 750; letter-spacing: 1px; }
    .app-title { margin: 0; color: #E5E5E5; font-size: 17px; font-weight: 750; }
    .version { margin: 11px 0 12px; color: #B8B8B8; font-size: 11px; }
    .download {
      display: flex;
      cursor: pointer;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid #606060;
      border-radius: 24px;
      background: #E5E5E5;
      color: #303030;
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
      transition: background .15s ease, transform .15s ease;
    }
    .download:hover { background: #fff; transform: translateY(-1px); }
    .download:focus-visible, .back-link:focus-visible { outline: 3px solid #B8B8B8; outline-offset: 3px; }
    .download svg { width: 16px; height: 16px; }
    @media (max-width: 700px) {
      .site-header { width: calc(100% - 36px); height: 64px; }
      .brand img { width: 31px; height: 31px; }
      .brand-name { font-size: 17px; }
      .hero {
        width: calc(100% - 36px);
        min-height: calc(100svh - 64px);
        padding: 42px 0 48px;

        align-content: center;

      }
      .hero-copy { text-align: center; }
      .eyebrow { margin-bottom: 12px; }
      h1 { max-width: 440px; margin: 0 auto; font-size: clamp(34px, 9vw, 44px); letter-spacing: -1.3px; }
      .intro { max-width: 390px; margin: 13px auto 0; font-size: 14px; }
      .download-card { max-width: 300px; margin: 0 auto; padding: 14px; border-radius: 18px; }
    }
    @media (max-width: 380px) {
      .site-header, .hero { width: calc(100% - 28px); }
      .hero { padding-top: 32px; gap: 23px; }
      .download-card { padding: 14px; }
    }
  </style>
</head>

        Download IcapsQ APK

    </section>
  </main>

</html>
