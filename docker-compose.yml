services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poll_backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - poll_data:/app/backend/csharp/GetItRight.Api
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8888,http://localhost:8090}
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: poll_web
    ports:
      - "127.0.0.1:8888:80"
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  poll_data:
