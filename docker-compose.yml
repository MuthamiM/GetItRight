services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poll_backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - poll_data:/app/backend/csharp/GetItRight.Api
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////app/backend/csharp/GetItRight.Api/getitright.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      - BROWSER_STORAGE_ENCRYPTION_KEY=${BROWSER_STORAGE_ENCRYPTION_KEY:?Set BROWSER_STORAGE_ENCRYPTION_KEY in .env before starting the stack}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-ipay}
      - IPAY_VENDOR_ID=${IPAY_VENDOR_ID:-}
      - IPAY_HASH_KEY=${IPAY_HASH_KEY:-}
      - IPAY_LIVE=${IPAY_LIVE:-0}
      - FLW_SECRET_KEY=${FLW_SECRET_KEY:-}
      - FLW_SECRET_HASH=${FLW_SECRET_HASH:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://icapsq.mftechnologies.org}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://icapsq.mftechnologies.org}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-info@mftechnologies.org}
      - RESEND_TEST_RECIPIENT=${RESEND_TEST_RECIPIENT:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-https://icapsq.mftechnologies.org/auth/forgot-password.html}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend-replica:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poll_backend_replica
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - poll_data:/app/backend/csharp/GetItRight.Api
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////app/backend/csharp/GetItRight.Api/getitright.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      - BROWSER_STORAGE_ENCRYPTION_KEY=${BROWSER_STORAGE_ENCRYPTION_KEY:?Set BROWSER_STORAGE_ENCRYPTION_KEY in .env before starting the stack}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-ipay}
      - IPAY_VENDOR_ID=${IPAY_VENDOR_ID:-}
      - IPAY_HASH_KEY=${IPAY_HASH_KEY:-}
      - IPAY_LIVE=${IPAY_LIVE:-0}
      - FLW_SECRET_KEY=${FLW_SECRET_KEY:-}
      - FLW_SECRET_HASH=${FLW_SECRET_HASH:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://icapsq.mftechnologies.org}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://icapsq.mftechnologies.org}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-info@mftechnologies.org}
      - RESEND_TEST_RECIPIENT=${RESEND_TEST_RECIPIENT:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-https://icapsq.mftechnologies.org/auth/forgot-password.html}
      - SKIP_DB_SCHEMA_SYNC=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: poll_web
    ports:
      - "127.0.0.1:8888:80"
      - "127.0.0.1:8090:80"
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_started
    restart: unless-stopped

volumes:
  poll_data:
