services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poll_backend
    ports:
      - "5000:5000"
    volumes:
      - poll_data:/app/backend/csharp/GetItRight.Api
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////app/backend/csharp/GetItRight.Api/getitright.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8888,http://localhost:8090}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - RESEND_TEST_RECIPIENT=${RESEND_TEST_RECIPIENT:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://127.0.0.1:8090/auth/forgot-password.html}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend-replica:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poll_backend_replica
    ports:
      - "5001:5000"
    volumes:
      - poll_data:/app/backend/csharp/GetItRight.Api
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////app/backend/csharp/GetItRight.Api/getitright.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting the stack}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8888,http://localhost:8090}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - RESEND_TEST_RECIPIENT=${RESEND_TEST_RECIPIENT:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://127.0.0.1:8090/auth/forgot-password.html}
      - SKIP_DB_SCHEMA_SYNC=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: poll_web
    ports:
      - "8888:80"
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_started
    restart: unless-stopped

volumes:
  poll_data:
